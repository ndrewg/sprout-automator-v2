name: ci
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: app/backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: corepack enable pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test          # vitest (the pure-fn tests)
      # Blocking audit: PRODUCTION dependencies only (phase 10 decision). A
      # finding here reaches users — it must fail the build. DevDependency
      # findings (tooling nobody deploys) are surfaced by the non-blocking step
      # below instead of red-ing every push.
      - run: pnpm audit --audit-level=high --prod
      # Full-tree audit (incl. devDependencies): visible, never blocking, so a
      # tooling advisory is seen but cannot rot the pipeline.
      - run: pnpm audit --audit-level=high
        continue-on-error: true
  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: app/frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: corepack enable pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test          # vitest (the src/**/*.test.ts/tsx unit tests)
      - run: pnpm build         # tsc -b && vite build → catches type errors
