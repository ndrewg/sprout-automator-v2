services:
  postgres:
    image: postgres:18-alpine
    container_name: sprout-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sprout}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sprout_dev_pw}
      POSTGRES_DB: ${POSTGRES_DB:-sprout}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      # postgres:18+ images store data in a version-specific subdirectory and
      # expect the volume mounted at /var/lib/postgresql (NOT .../data, which the
      # image now treats as an "unused mount" and refuses to start on).
      # See docker-library/postgres PR #1259. The spec's doc-04 compose predates
      # this pg18 change; everything else here is verbatim.
      - sprout-pgdata:/var/lib/postgresql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-sprout} -d ${POSTGRES_DB:-sprout}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - sprout-net

  backend:
    build:
      context: ./app
      dockerfile: ./backend/Dockerfile
    container_name: sprout-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 3000
      DATABASE_URL: postgres://${POSTGRES_USER:-sprout}:${POSTGRES_PASSWORD:-sprout_dev_pw}@postgres:5432/${POSTGRES_DB:-sprout}
      APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY}
      SESSION_SECRET: ${SESSION_SECRET}
      DATA_DIR: /app/data
      SPROUT_URL: ${SPROUT_URL:-https://kmcsolutions.hrhub.ph/}
      # The remaining config.ts keys are passed through with ${KEY:-}
      # interpolation — the `:-` supplies an EMPTY default (no "variable is not
      # set" warning) and nothing more. config.ts is the single source of truth
      # for real defaults; a duplicated default in compose is a second place to
      # be wrong, and an unset key (empty string in the container) must behave
      # identically to an unset key in a native run (config.ts treats both as
      # absent). The keys ABOVE with bare ${KEY} (APP_ENCRYPTION_KEY,
      # SESSION_SECRET) deliberately stay bare: a missing value there is a real
      # problem, and the warning is the signal.
      APP_URL: ${APP_URL:-}
      AUTH_RATE_LIMIT: ${AUTH_RATE_LIMIT:-}
      MAIL_FROM: ${MAIL_FROM:-}
      MAX_CONCURRENT_RUNS: ${MAX_CONCURRENT_RUNS:-}
      MISSED_RUN_GRACE_MINUTES: ${MISSED_RUN_GRACE_MINUTES:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      SIGNUP_ALLOWED: ${SIGNUP_ALLOWED:-}
      TRUSTED_CLOUDFLARE_PEERS: ${TRUSTED_CLOUDFLARE_PEERS:-}
      TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:-}
      TZ: ${TZ:-Asia/Manila}
    ports:
      - "${BACKEND_PORT:-3000}:3000"
    volumes:
      - sprout-backend-data:/app/data
    networks:
      - sprout-net

volumes:
  sprout-pgdata:
  sprout-backend-data:

networks:
  sprout-net:
    driver: bridge
